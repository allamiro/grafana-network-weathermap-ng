services:
  grafana:
    build:
      context: grafana
      args:
        GRAFANA_VERSION: ${GRAFANA_VERSION:-12.4.0}
        # Zabbix datasource app for the multi-datasource demo (#256).
        GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app,grafana-clock-panel
    ports:
      - 3101:3000
    volumes:
      - ../dist:/var/lib/grafana-plugins/tamirsuliman-weathermap-panel
    environment:
      - GF_APP_MODE=development
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=tamirsuliman-weathermap-panel
  prometheus:
    image: prom/prometheus
    volumes:
      - ./exporter/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
  exporter:
    build:
      context: exporter
      dockerfile: Dockerfile
    ports:
      # Published so the browser can load the background images served by the
      # exporter (floor-plan and world-map demo dashboards).
      - 8080:8080
  # Multi-datasource demos (#253): the same simulated metrics flow into
  # InfluxDB and Elasticsearch via the bridge, so the per-datasource
  # dashboards render the identical map from identical numbers.
  influxdb:
    image: influxdb:2.7
    ports:
      - 8086:8086
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=wm
      - DOCKER_INFLUXDB_INIT_PASSWORD=wm-password
      - DOCKER_INFLUXDB_INIT_ORG=wm
      - DOCKER_INFLUXDB_INIT_BUCKET=wm
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=wm-token
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    ports:
      - 9200:9200
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
  # Zabbix (#256): full server so the Zabbix datasource can be demoed live.
  # The bridge seeds a host with one trapper item per series and pushes
  # values with the zabbix_sender protocol.
  zabbix-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    depends_on:
      - zabbix-db
    ports:
      - 10051:10051
    environment:
      - DB_SERVER_HOST=zabbix-db
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    depends_on:
      - zabbix-server
    ports:
      # 8080 belongs to the exporter; Zabbix UI/API on 8081.
      - 8081:8080
    environment:
      - DB_SERVER_HOST=zabbix-db
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=UTC
      # 204 items x 1h of 5s history through the JSON-RPC API blows the
      # default 128M PHP memory_limit (API returns 500). The web image wires
      # ZBX_MEMORYLIMIT into php-fpm's memory_limit.
      - ZBX_MEMORYLIMIT=1024M
  bridge:
    build:
      context: bridge
      dockerfile: Dockerfile
    depends_on:
      - exporter
      - influxdb
      - elasticsearch
      - zabbix-server
      - zabbix-web
