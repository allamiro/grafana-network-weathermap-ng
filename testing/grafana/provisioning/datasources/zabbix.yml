apiVersion: 1
datasources:
  - name: Zabbix
    uid: zabbix-wm
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    jsonData:
      username: Admin
      # Long ranges read hourly trend aggregates instead of raw 5s history -
      # keeps API payloads small when zooming out.
      trends: true
      trendsFrom: 4h
    secureJsonData:
      password: zabbix
