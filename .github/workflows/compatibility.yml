name: Grafana API Compatibility

on:
  push:
    paths:
      - 'src/**'
      - 'package.json'
  pull_request:

# Least-privilege default for the GITHUB_TOKEN; jobs that need more (the
# PR-comment step in the latest check) declare their own block.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Job 1: ADVISORY — checks against the newest (possibly unsupported)
  # Grafana SDK so upcoming breakage is visible early without blocking merges
  # (fail-if-incompatible: 'no' below is deliberate).
  compatibility-latest:
    name: Check Grafana API compatibility (latest)
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # Plain npm ci matches test/release; the lockfile resolves cleanly.
      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Check compatibility with latest Grafana APIs
        uses: grafana/plugin-actions/is-compatible@main
        with:
          module: './src/module.ts'
          # Fork PRs get a read-only GITHUB_TOKEN, so posting the report fails
          # the job even when Levitate finds nothing (#376). Comment only on
          # same-repo PRs; the report is still in the job log either way.
          comment-pr: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'yes' || 'no' }}
          fail-if-incompatible: 'no'

  # Job 2: BLOCKING — matrix check against each supported Grafana SDK version
  # (11.0.0, 12.0.0, 13.1.0 — the plugin's grafanaDependency is >=11.0.0, so
  # 10.x is not checked). Each leg overlays that version's @grafana/data, ui
  # and runtime (--no-save, so package.json is untouched), then:
  #   1. type-checks src/ (minus tests) with tsc against the overlaid SDK typings — this is
  #      what catches an API used by the plugin that is missing or has a
  #      different signature in that version (skipLibCheck is already on via
  #      @grafana/tsconfig, so only our code is checked, not Grafana's .d.ts);
  #   2. runs levitate, which compares the overlaid version's exported API
  #      with the latest npm release.
  # Either step exiting non-zero fails the leg and gates the PR.
  compatibility-matrix:
    name: Grafana ${{ matrix.grafana-version }} API check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grafana-version: ['11.0.0', '12.0.0', '13.1.0']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # Plain npm ci matches test/release; the lockfile resolves cleanly.
      - name: Install dependencies
        run: npm ci

      # --legacy-peer-deps is required HERE (and only here): overlaying a
      # different @grafana/* major on top of the locked tree creates real
      # peer conflicts that are intentional for this check.
      - name: Overlay Grafana ${{ matrix.grafana-version }} SDK packages
        run: |
          npm install --no-save --legacy-peer-deps \
            @grafana/data@${{ matrix.grafana-version }} \
            @grafana/ui@${{ matrix.grafana-version }} \
            @grafana/runtime@${{ matrix.grafana-version }}

      # Prints the resolved versions so the log proves which SDK was checked.
      # Checks what ships: src/ without tests. Test files type jest mocks of
      # Grafana components, whose inferred types shift between SDK versions
      # (implicit-any noise on 11.0.0); they are type-checked on the default
      # install by `npm run typecheck` in the Test workflow.
      - name: Type-check plugin against Grafana ${{ matrix.grafana-version }} SDK
        run: |
          for p in data ui runtime; do
            echo "@grafana/$p $(node -p "require('@grafana/$p/package.json').version")"
          done
          cat > tsconfig.sdk-check.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "exclude": ["src/**/*.test.ts", "src/**/*.test.tsx", "src/**/__mocks__/**", "src/test/**"]
          }
          EOF
          npx tsc --noEmit -p tsconfig.sdk-check.json

      - name: Check API compatibility (levitate)
        run: |
          npx --yes @grafana/levitate@latest is-compatible \
            --path src/module.ts \
            --target @grafana/data,@grafana/ui,@grafana/runtime
