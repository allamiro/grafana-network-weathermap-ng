name: Dependabot auto-merge

# Patch and minor dependency updates (including security fixes) merge on their
# own once every check the `main` ruleset requires has passed: Test, the
# Grafana API checks and E2E result. Nothing merges on a red or missing check,
# and the merge is a squash authored by Dependabot.
#
# Major updates of development tools (lint, test, build, types) auto-merge too:
# lint, typecheck, the unit tests, the production build and E2E exercise them
# fully, so a green run is the review. Majors of packages that ship in the
# plugin, and of GitHub Actions, are left open with a comment.
on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge
    # Only Dependabot's own PRs in this repository; fork PRs never qualify.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'allamiro/grafana-network-weathermap-ng'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the update's metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch/minor updates and dev-tool majors when checks pass
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' ||
          (steps.meta.outputs.package-ecosystem == 'npm_and_yarn' &&
           steps.meta.outputs.dependency-type == 'direct:development')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Leave other major updates for review
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-major' &&
          !(steps.meta.outputs.package-ecosystem == 'npm_and_yarn' &&
            steps.meta.outputs.dependency-type == 'direct:development')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
        run: |
          gh pr comment "$PR_URL" --body "Major version update ($DEPS): not merged automatically, because only npm development-tool majors auto-merge. Check the release notes for breaking changes, then merge by hand."
