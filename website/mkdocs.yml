site_name: Network Weathermap NG
site_description: A modernized, actively maintained network weathermap panel plugin for Grafana
site_author: Tamir Suliman
repo_url: https://github.com/allamiro/grafana-network-weathermap-ng
repo_name: allamiro/grafana-network-weathermap-ng
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
  logo: assets/logo.svg
  palette:
    # Dracula (dark) only — styled via stylesheets/dracula.css. The light
    # scheme was dropped deliberately: every screenshot on this site is a dark
    # Grafana capture, and they read as bright rectangles punched into a white
    # page. One scheme also means one set of colors to keep correct.
    - scheme: slate
      primary: black
extra_css:
  - stylesheets/dracula.css
  - stylesheets/lightbox.css
extra_javascript:
  - javascripts/lightbox.js
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Tutorial:
      - Getting Started: guide/getting-started.md
      - Migrating from knightss27: guide/migrating.md
      - Nodes (Devices): guide/nodes.md
      - Links: guide/links.md
      - Panel Options: guide/panel-options.md
      - Interactions & Editing: guide/interactions.md
      - Traffic Animation: guide/animation.md
      - BGP Neighbor Status: guide/bgp.md
      - Use Cases: guide/use-cases.md
      - Data Sources: guide/datasources.md
  - Customization: customization.md
  - Icon Reference: icons.md
  - Reference: reference.md
  - FAQ: faq.md
  - Contributing: https://github.com/allamiro/grafana-network-weathermap-ng/blob/main/CONTRIBUTING.md
