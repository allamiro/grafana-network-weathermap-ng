# snmp_exporter *generator* modules for BGP neighbor state + prefix counts.
#
# Append these under `modules:` in your snmp_exporter generator.yml, drop the
# matching vendor MIBs into generator/mibs/, then `make generate` (or the
# docker generator) to produce snmp.yml. Point Prometheus at the module for
# each device's platform, then load tools/bgp/bgp-recording-rules.yml to
# normalize the raw OIDs into bgp_session_up / bgp_prefixes_* .
#
# Pick the walk that matches the box:
#   Cisco IOS/IOS-XE/NX-OS  -> bgp_cisco   (cbgpPeer2 table, IPv4 + IPv6)
#   Juniper Junos           -> bgp_juniper (jnxBgpM2 tables)
#   F5 BIG-IP / generic      -> bgp_standard (RFC 4273 BGP4-MIB, IPv4 unicast)
#
# Reachability note: SNMP is pull, so the exporter must reach each device on
# UDP/161 (or TCP), and across a firewalled enclave that flow must be permitted.
# For richer/multi-AFI data prefer gNMI/OpenConfig (see tools/bgp/README.md).

modules:
  # ------------------------------------------------------------- Cisco -------
  # CISCO-BGP4-MIB cbgpPeer2 table — supports IPv4 and IPv6 address families.
  bgp_cisco:
    walk:
      - 1.3.6.1.4.1.9.9.187.1.2.5.1.3   # cbgpPeer2State (idle..established 1..6)
      - 1.3.6.1.4.1.9.9.187.1.2.5.1.19  # cbgpPeer2FsmEstablishedTime (seconds)
      - 1.3.6.1.4.1.9.9.187.1.2.8.1.1   # cbgpPeer2AcceptedPrefixes
      - 1.3.6.1.4.1.9.9.187.1.2.8.1.6   # cbgpPeer2AdvertisedPrefixes
      - 1.3.6.1.4.1.9.9.187.1.2.8.1.3   # cbgpPeer2PrefixAdminLimit
    auth:
      community: public   # use SNMPv3 in production

  # ----------------------------------------------------------- Juniper -------
  # BGP4-V2-MIB-JUNIPER (jnxBgpM2). Peer table + per-AFI/SAFI prefix table.
  bgp_juniper:
    walk:
      - 1.3.6.1.4.1.2636.5.1.1.2.1.1.1.2   # jnxBgpM2PeerState (1..6)
      - 1.3.6.1.4.1.2636.5.1.1.2.6.2.1.8   # jnxBgpM2PrefixInPrefixesAccepted
      - 1.3.6.1.4.1.2636.5.1.1.2.6.2.1.10  # jnxBgpM2PrefixOutPrefixes
      - 1.3.6.1.4.1.2636.5.1.1.2.4.1.1.1   # jnxBgpM2PeerFsmEstablishedTime (s)
      - 1.3.6.1.4.1.2636.5.1.1.2.1.1.1.13  # jnxBgpM2PeerRemoteAs (label)
    auth:
      community: public

  # -------------------------------------------- Standard BGP4-MIB / F5 -------
  # RFC 4273 (IPv4 unicast only). Works on F5 BIG-IP advanced routing and many
  # other platforms. No prefix-count OIDs in this MIB — use update counters, or
  # the vendor module / gNMI for real prefix numbers.
  bgp_standard:
    walk:
      - 1.3.6.1.2.1.15.3.1.2    # bgpPeerState (1..6)
      - 1.3.6.1.2.1.15.3.1.16   # bgpPeerFsmEstablishedTime
      - 1.3.6.1.2.1.15.3.1.9    # bgpPeerRemoteAs (label)
      - 1.3.6.1.2.1.15.3.1.10   # bgpPeerInUpdates
      - 1.3.6.1.2.1.15.3.1.11   # bgpPeerOutUpdates
    auth:
      community: public
